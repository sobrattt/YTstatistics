<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Style Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

  <div class="p-6 space-y-6">

    <div class="flex justify-end">
      <a href="/login" class="bg-white text-black text-sm font-medium px-4 py-2 rounded shadow hover:bg-gray-200 transition">
        Add Account
      </a>
    </div>

    <form method="POST" action="/statistics">
      <div class="flex flex-wrap gap-8 justify-center">

        <div class="flex flex-col gap-6 min-w-[250px]">
          <div>
            <label for="accounts" class="block font-bold mb-1">Select Accounts:</label>
            <select id="accounts" name="accounts" class="w-72 p-2 rounded bg-white text-black shadow">
              {% for account in accounts %}
              <option value="{{account}}">{{account}}</option>
              {% endfor %}
            </select>
          </div>

          <div class="flex flex-wrap gap-4">
            <div>
              <label for="start-date" class="block font-bold mb-1">Start Date:</label>
              <input type="date" id="start-date" name="start_date" class="w-44 p-2 rounded bg-white text-black shadow" />
            </div>
            <div>
              <label for="end-date" class="block font-bold mb-1">End Date:</label>
              <input type="date" id="end-date" name="end_date" class="w-44 p-2 rounded bg-white text-black shadow" />
            </div>
          </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow-lg max-w-4xl w-full">
          <label class="block font-bold mb-4">Select Metrics:</label>
          <div class="grid grid-cols-2 gap-4">
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="views" class="w-4 h-4 text-red-500" />
              <span>Views</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="averageViewDuration" class="w-4 h-4 text-red-500" />
              <span>Average View Duration</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="annotationClickThroughRate" class="w-4 h-4 text-red-500" />
              <span>Annotation CTR</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="likes" class="w-4 h-4 text-red-500" />
              <span>Likes</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="dislikes" class="w-4 h-4 text-red-500" />
              <span>Dislikes</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="averageViewPercentage" class="w-4 h-4 text-red-500" />
              <span>Average View %</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="subscribersGained" class="w-4 h-4 text-red-500" />
              <span>Subscribers Gained</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow">
              <input type="checkbox" name="option" value="subscribersLost" class="w-4 h-4 text-red-500" />
              <span>Subscribers Lost</span>
            </label>
            <label class="flex items-center gap-3 bg-gray-700 p-3 rounded shadow col-span-2">
              <input type="checkbox" name="option" value="comments" class="w-4 h-4 text-red-500" />
              <span>Comments</span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex justify-center mt-8 gap-4">
        <button type="submit"
                class="bg-white text-black font-semibold px-6 py-3 rounded shadow hover:bg-gray-200 transition">
          Submit
        </button>
        <button type="submit"
                formaction="/weeklystatistics"
                class="bg-white text-black font-semibold px-6 py-3 rounded shadow hover:bg-gray-200 transition">
          One Week
        </button>
      </div>
    </form>
  </div>

</body>
</html>
